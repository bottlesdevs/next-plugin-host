[package]
name = "bottles-plugin-host"
description = "Wasm plugin host for Bottles Next"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
semver.workspace = true
thiserror.workspace = true
toml = "0.9.10"
async-trait.workspace = true
tokio = { workspace = true, features = ["sync"] }
tokio-util = { workspace = true, features = ["rt"] }
url = { workspace = true, features = ["serde"] }
wasmtime = { version = "47", default-features = false, features = ["async", "component-model", "cranelift", "parallel-compilation"] }
wasmtime-wasi = { version = "47", default-features = false, features = ["p2"] }
wasmtime-wasi-http = { version = "47", default-features = false, features = ["default-send-request", "p2"] }
