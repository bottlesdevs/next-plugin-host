[package]
name = "bottles-plugin-host"
description = "Wasm plugin host for Bottles Next"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-fs.workspace = true
next-config.workspace = true
tracing.workspace = true
uuid = { workspace = true, features = ["serde"] }
wasmparser = "0.252"
blocking.workspace = true
serde.workspace = true
semver.workspace = true
thiserror.workspace = true
toml = "0.9.10"
async-trait.workspace = true
tokio = { workspace = true, features = ["sync"] }
tokio-util = { workspace = true, features = ["rt"] }
url = { workspace = true, features = ["serde"] }
wasmtime = { version = "47", default-features = false, features = ["async", "component-model", "cranelift", "parallel-compilation"] }
wasmtime-wasi = { version = "47", default-features = false, features = ["p2"] }
wasmtime-wasi-http = { version = "47", default-features = false, features = ["default-send-request", "p2"] }

[build-dependencies]
heck = "0.5"
wit-parser = { version = "0.252", default-features = false, features = ["std"] }
